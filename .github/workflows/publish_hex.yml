name: Publish Hex

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: hex-publish
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.2"
          otp-version: "27.2"

      - name: Install Hex/Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        env:
          MIX_ENV: test
        run: mix deps.get

      - name: Run tests
        env:
          MIX_ENV: test
        run: mix test

      - name: Verify tag matches mix.exs version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MIX_VERSION=$(grep -oE 'version:[[:space:]]*"[^"]+"' mix.exs | head -n1 | grep -oE '"[^"]+"' | tr -d '"')

          echo "Git tag version: $TAG_VERSION"
          echo "mix.exs version: $MIX_VERSION"

          if [ -z "$MIX_VERSION" ]; then
            echo "Error: failed to extract version from mix.exs"
            exit 1
          fi

          if [ "$TAG_VERSION" != "$MIX_VERSION" ]; then
            echo "Error: tag version ($TAG_VERSION) does not match mix.exs version ($MIX_VERSION)"
            exit 1
          fi

          echo "Versions match"

      - name: Publish package to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          MIX_ENV: prod
        run: mix hex.publish --yes
